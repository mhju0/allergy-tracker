<svg xmlns="http://www.w3.org/2000/svg" width="880" height="96" viewBox="0 0 880 96" role="img" aria-label="네 가지 상태 — 안 먹어봄, 관찰 중, 안전, 반응">
  <g font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" text-anchor="middle">
    <text x="110" y="42" font-size="19" font-weight="800" fill="#6E675A">○&#160;&#160;안 먹어봄</text>
    <text x="110" y="68" font-size="12.5" fill="#6E675A">never introduced</text>

    <text x="330" y="42" font-size="19" font-weight="800" fill="#96631A">◐&#160;&#160;관찰 중</text>
    <text x="330" y="68" font-size="12.5" fill="#6E675A">inside the 3-day window</text>

    <text x="550" y="42" font-size="19" font-weight="800" fill="#2E7D4F">✓&#160;&#160;안전</text>
    <text x="550" y="68" font-size="12.5" fill="#6E675A">window closed, nothing seen</text>

    <text x="770" y="42" font-size="19" font-weight="800" fill="#A8432B">✕&#160;&#160;반응</text>
    <text x="770" y="68" font-size="12.5" fill="#6E675A">a reaction was logged</text>
  </g>
  <path d="M220 24V72M440 24V72M660 24V72" stroke="#E4DED2" stroke-width="1"/>
</svg>
